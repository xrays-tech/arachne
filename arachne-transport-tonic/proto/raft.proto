// Arachne raft transport wire protocol (M1).
//
// A single unary `Send` RPC carries one already-framed raft payload together
// with the handshake envelope (`Hello`) the sender uses to prove it belongs to
// the right cluster at a compatible protocol version. The server validates the
// handshake before accepting the payload.
//
// M1 is plaintext gRPC (mTLS lands at M4). The handshake (protocol_version /
// cluster_id / node_id / feature_flags) belongs to M1: it rides on every
// message and is validated on the receiving side.
syntax = "proto3";

package raft;

service RaftTransport {
  // Deliver one raft payload to this node.
  rpc Send(RaftEnvelope) returns (SendReply);

  // Stream one snapshot's bytes to a follower (propsol rev T, v0.2.17).
  //
  // Why this exists: raft hands a snapshot over as a single `Message`, and the
  // gRPC message cap above is 8 MiB while the snapshot threshold is 64 MiB
  // (Lan), so a snapshot above the cap could never be transferred at all — a
  // follower that fell behind `wal_trailing_keep` could never catch up. The
  // follower still learns *that* it needs a snapshot from raft itself; this RPC
  // only carries the bytes, in chunks, without a whole-message size bound.
  rpc FetchSnapshot(SnapshotRequest) returns (stream SnapshotChunk);

  // Forward a client command to the leader (propsol v0.2.19).
  //
  // In a multi-process deployment a follower's client command that it cannot
  // serve locally (a non-leader answers `NotLeader`) has no in-process peer to
  // hop to. It is forwarded over the wire to the leader, which runs it against
  // its own runtime and replies with the outcome. The sender's identity comes
  // from the handshake (`hello`), and the session envelope (`client_id` /
  // `seq_no`) is carried through so the leader reissues the command with the
  // *original* session id — idempotent, propsol INV5. If the forwarded target
  // is itself a follower, it answers `not_leader` with a fresh leader hint so
  // the client can re-redirect.
  rpc Forward(ForwardRequest) returns (ForwardReply);
}

// One message in transit: the opaque raft payload plus its handshake.
message RaftEnvelope {
  // The already-framed raft wire payload (a serialized raft 0.7 `Message`).
  //
  // MESSAGE-SIZE COUPLING (M1): the transport caps gRPC messages at
  // `max_message_size` (default 8 MiB) on BOTH the client and the server —
  // deliberately left above tonic's 4 MiB default so the largest raft payload
  // the core allows (the Lan preset's 4 MiB `max_size_per_msg`) always fits with
  // headroom. If the core's `max_size_per_msg` ever grows past ~8 MiB, this cap
  // (see `TransportConfig::max_message_size` / `TonicTransportFactory::
  // max_message_size`) must be raised in step, or oversized payloads fail with
  // a `RESOURCE_EXHAUSTED` status on both ends.
  bytes payload = 1;
  // The sender's handshake (protocol version, cluster id, node id, flags).
  Hello hello = 2;
}

// The handshake exchanged on every send (propsol §5.6).
message Hello {
  // Protocol major version. Receiving nodes reject any *other* major.
  uint32 protocol_major = 1;
  // Protocol minor version. Receiving nodes accept only `peer_minor <= self_minor`
  // (backward-compatible only).
  uint32 protocol_minor = 2;
  // The cluster this sender belongs to. Must equal the receiver's cluster id.
  string cluster_id = 3;
  // The sender's node id (the authoritative sender tag the receiver trusts).
  string node_id = 4;
  // Optional feature flags the sender advertises (empty in M1).
  repeated string feature_flags = 5;
}

// A follower's request for one snapshot's bytes (rev T).
message SnapshotRequest {
  // The snapshot's position. Both are part of its file name, so together they
  // identify it exactly.
  uint64 index = 1;
  uint64 term = 2;
  // The requester's handshake. Validated *before* a single byte is served: a
  // snapshot is cluster data, so an unauthenticated caller must not receive it.
  Hello hello = 3;
}

// One chunk of a snapshot stream.
//
// Chunk boundaries carry no meaning: the receiver concatenates them and
// validates the snapshot's own CRC (propsol rev T, invariant I9), so the
// server may split wherever it likes.
message SnapshotChunk {
  // The next bytes of the snapshot, in order.
  bytes data = 1;
}

// The server's verdict on an inbound `Send`.
message SendReply {
  // `true` when the handshake passed and the payload was accepted.
  bool accepted = 1;
  // Empty on success; otherwise a stable error code
  // (`cluster_id_mismatch` / `protocol_mismatch` / …).
  string error_code = 2;
}

// A forwarded client command (propsol v0.2.19).
message ForwardRequest {
  // The operation: 0 = propose (write), 1 = read (ReadIndex), 2 = stale read.
  //
  // `kind` is a 0-based discriminant (proto3 leaves 0 as the default): a
  // `Default(ForwardRequest)` would read as an empty propose and is rejected
  // by the handshake / payload validation below, so no separate "kind must
  // be set" check is needed.
  uint32 kind = 1;
  // The encoded state-machine command (for a propose).
  bytes cmd = 2;
  // The key (for a read / stale read).
  bytes key = 3;
  // The sender's session client id. Carried through to the leader for
  // idempotent dedup (propsol INV5) — never minted fresh by the leader.
  uint64 client_id = 4;
  // The sender's session sequence number (propsol INV5).
  uint64 seq_no = 5;
  // The sender's handshake. Validated before the command runs, exactly as
  // for `Send` (propsol §5.6). Its `node_id` is the sender of the command.
  Hello hello = 6;
}

// The server's verdict on a forwarded command (propsol v0.2.19).
message ForwardReply {
  // `true` when the command ran to completion (write applied, read served).
  bool ok = 1;
  // Empty on success; otherwise a stable error code.
  string error_code = 2;
  // The read's value; absent for a successful write or any failure.
  bytes value = 3;
  // Leader hint, present only on a `not_leader` answer: the node to try next
  // (the hint the forwarded node itself would have answered with locally).
  string leader_node_id = 4;
  string leader_addr = 5;
}
