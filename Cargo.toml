# Arachne workspace
#
# Virtual (root-less) workspace: there is no root package. The members below
# are the only crates built as part of the workspace.
#
# NOTE: `l2/`, `fuzz/`, and `model-check/` are intentionally NOT workspace
# members. They are standalone harnesses (each gets its own toolchain / build
# config) and will be wired up in later phases.

[workspace]
members = [
    "arachne-seam",
    "arachne",
    "arachne-transport-tonic",
    "arachne-node",
    "arachne-testsupport",
    "arachne-sim",
]
# Edition 2024 => resolver v3 (feature-resolver semantics for the 2024 edition).
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"
repository = "https://github.com/xrays-tech/arachne"

# Intra-workspace path dependencies. The core (`arachne-kv`, `arachne-kv-seam`,
# `arachne-kv-testsupport`) has ZERO external crates and builds fully offline.
# The `arachne-kv-transport-tonic` member pulls in tonic/rustls when its feature
# is enabled (see `scripts/check-deps.sh` Gate B for the lean-core invariant).
[workspace.dependencies]
# The `version` is required at publish time: workspace deps used via
# `{ workspace = true }` must resolve to a version when the member is packaged
# (the `path` is stripped from the published manifest).
arachne-kv-seam = { path = "arachne-seam", version = "0.1.0" }
# The workspace-wide default for `arachne-kv` is the LEAN core (no transport).
# `default-features = false` is the single source of truth here (cargo does not
# let a member override it). Crates that want the tonic transport opt in
# explicitly with `features = ["transport-tonic"]` (see arachne-kv-node).
arachne-kv = { path = "arachne", version = "0.1.0", default-features = false }
arachne-kv-transport-tonic = { path = "arachne-transport-tonic", version = "0.1.0" }
arachne-kv-node = { path = "arachne-node", version = "0.1.0" }
arachne-kv-testsupport = { path = "arachne-testsupport", version = "0.1.0" }
arachne-kv-sim = { path = "arachne-sim", version = "0.1.0" }

# D-S1 (test-plan §5 E3): inject a minimal seedable election-RNG hook into the
# consensus core so the L2 same-seed double-run gate is provable. `raft` 0.7.0
# otherwise draws its randomized election timeout from the unseedable
# process-wide `thread_rng`. The vendored copy in `third_party/raft/` is
# byte-identical to the registry source except for that single hook (see
# `third_party/raft/ARACHNE-PATCH.md`). `raft-proto` stays on the registry —
# only `raft` is patched.
[patch.crates-io]
raft = { path = "third_party/raft" }
