[package]
name = "arachne-node"
description = "Arachne node binary: a runnable single-node Arachne process (WAL + raft + KV state machine + /readyz + /metrics)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# D-ART-testobs (test-plan §3.3): the ONE recorded exception to the "no test
# code in production" rule. Enabling it adds structured stdout markers
# (`ready` / `shutdown`) that the L4 fault injector uses for phase-precise kills;
# it changes nothing else (no extra state, no behavior change). It is NOT a
# default feature — CI (`scripts/check-release-features.sh`) enforces that
# release/publish builds exclude it.
test-observability = []

[dependencies]
# The LEAN core (no transport): the node composes the transport explicitly.
# The workspace default for `arachne` is lean, so the core itself never links
# tonic; the real transport is pulled in directly below. (Gate A is
# unaffected: no test/sim scaffolding is pulled in.)
arachne = { workspace = true }
# The real network transport (M1): the node binds one listener per process and
# mints its `(Tx, Rx)` halves through a `TonicTransportFactory`.
arachne-transport-tonic = { workspace = true }
# Async runtime: drives the raft Ready loop, the tick interval, and signals.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time"] }
# Hyper HTTP/1.1 server (propsol rev U U1). Already in the dependency tree via
# tonic; here promoted to direct deps to replace the hand-rolled blocking HTTP
# server (which had a 20ms idle-accept poll and no keep-alive). hyper-util is
# only for the `TokioIo` bridge to hyper's rt traits.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
# Config parsing (TOML).
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# The `RaftNode` takes a `&slog::Logger`; M0 uses a no-op sink (see
# `build_logger`). Structured terminal logging lands at M1.
slog = "2"

[dev-dependencies]
# The integration tests (tests/) drive the async `RaftNode` directly, so they
# need a tokio runtime. `arachne` stays lean (no transport) in the test build;
# this is a dev-only dependency (Gate A checks the normal tree with `-e normal`).
tokio = { version = "1", features = ["rt", "macros"] }
