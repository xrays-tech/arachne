[package]
name = "arachne"
description = "Arachne: transport-agnostic product core (consensus, WAL storage, KV state machine)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The default build pulls the tonic transport through an optional dependency.
# Build with `--no-default-features` for a "lean" core with no transport at all.
default = ["transport-tonic"]
transport-tonic = ["dep:arachne-transport-tonic"]
# Test-only crash injection at `RaftNode::step`'s ready-stage boundaries
# (propsol v0.2.9 L / INV2). NOT a default feature and excluded from
# release/publish builds (enforced by `scripts/check-release-features.sh`); when
# off, the hook module and its call sites are compiled out entirely.
fault-injection = []

[dependencies]
# The seam traits and shared value types live in the leaf `arachne-seam` crate.
# This is a normal (always-on) dependency: the core re-exports those items so
# its public API is unchanged. `arachne-seam` is a leaf (no deps), so it adds
# nothing to the dependency tree beyond itself.
arachne-seam = { workspace = true }

# The raft consensus library. `raft` 0.7 is the pinned version for the
# consensus core (P4a). It pulls in `protobuf` for message serialization.
raft = "0.7"
slog = "2"
thiserror = "1"
protobuf = "2"
# The node runtime actor (`runtime`) is an async `tokio` task: it owns the
# command channel, the tick interval, and its bounded waits. `tokio` is an
# always-on dependency of the core (the actor genuinely needs a runtime). It is
# NOT a network dependency, so the lean core (`--no-default-features`) still
# builds without the tonic transport (check-deps Gate B is unaffected). Both
# `tokio` and `tokio-util` are already in the dependency tree (via
# `arachne-transport-tonic`/`arachne-node`), so this adds no new external crate.
# `rt-multi-thread` is also enabled because the multi-node embedding facade
# (`Arachne::start`) drives the tonic gRPC server on a private *multithread*
# tokio runtime (`Builder::new_multi_thread`); the actor thread itself still
# uses a current-thread runtime, so this only adds the multithread executor
# and remains transport-independent.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
# `join_all` is the cross-peer concurrency primitive for the fast-path deliver
# loop. `futures-util` is already in the dependency tree (via
# `tokio-util`/`tonic`), so listing it here adds no new external crate.
futures-util = "0.3"

# Optional: only compiled when the `transport-tonic` feature is enabled.
# This is the sole edge from the core to a concrete transport, and it is the
# only crate allowed to reference tonic/rustls types.
arachne-transport-tonic = { workspace = true, optional = true }

# B4 / U2-bis: WAL segment extent pre-allocation (fallocate(2) with
# FALLOC_FL_KEEP_SIZE) needs a thin C binding on Linux. `libc` is already in
# the tree (via tokio) and is a ~2-line stdlib wrapper, so this adds no new
# crate to the dependency graph.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test-only: the test support crate provides the FsyncLedger and FaultyStorage
# for integration tests. This is a dev-dependency only (enforced by
# scripts/check-deps.sh Gate A: production crates may only pull in
# arachne-testsupport via [dev-dependencies]).
        arachne-testsupport = { workspace = true }
        # The client/runtime integration tests are async (`#[tokio::test]`) and await
        # commands against a running runtime actor; `tokio` is dev-only (the core itself
        # is runtime-agnostic).
        tokio = { version = "1", features = ["rt", "macros", "time", "net", "rt-multi-thread", "signal"] }
        # Dev-only: the `axum_http` example (examples/axum_http.rs) wraps the
        # `arachne::server` facade in an axum HTTP service. axum is already in the
        # lock (transitively via the tonic edge); listing it here adds no new
        # external crate. It is dev-dependency-only, so the production
        # `cargo tree -e normal` (check-deps Gates A/B/C) is unaffected. A plain
        # `axum` is all that is required: the example uses axum's default body type
        # (`axum::body::Body`), and axum 0.7's `Router` is generic over the
        # *state* (here the default `()`, trivially `Clone`/`Send`), not the body.
        axum = "0.7"
        # NOTE: integration tests (`tests/`) are part of this package and can therefore
        # use the normal `[dependencies]` directly (`slog`, `raft`, ...). No extra
        # dev-dependency entries are needed for those.
