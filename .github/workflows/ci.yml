name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The fuzz job runs on a nightly schedule and on manual dispatch only
  # (not per-PR, to keep PR feedback fast).
  schedule:
    - cron: "0 4 * * *" # nightly at 04:00 UTC
  workflow_dispatch:

# The workspace pins its toolchain in rust-toolchain.toml (channel = "1.93.1").
env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install exactly the toolchain pinned in rust-toolchain.toml so CI is
      # reproducible regardless of the runner's preinstalled Rust.
      - name: Install Rust toolchain pinned by rust-toolchain.toml
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          [ -n "${channel}" ] || { echo "error: could not parse channel from rust-toolchain.toml"; exit 1; }
          echo "Installing Rust toolchain ${channel} (pinned by rust-toolchain.toml)"
          rustup toolchain install "${channel}" --profile minimal
          rustup default "${channel}"
          cargo --version
          rustc --version

      # `raft-proto`'s `protobuf-build` (a dependency of the `arachne` core)
      # requires a `protoc` whose version is 3.x and rejects the newer
      # calendar-versioned releases modern distros ship. Install a pinned 3.x
      # and put it on PATH; `scripts/find-protoc.sh` (pointed at by PROTOC in
      # .cargo/config.toml) then resolves it.
      - name: Install protoc 3.x (raft-proto codegen requirement)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip
          unzip -o -q /tmp/protoc.zip -d "$HOME/protoc3"
          echo "$HOME/protoc3/bin" >> "$GITHUB_PATH"
          "$HOME/protoc3/bin/protoc" --version

      - name: Build workspace
        run: cargo build --workspace

      # `fuzz/` and `model-check/` are standalone workspaces, so the workspace
      # build above cannot see them — which is how `fuzz/` silently stopped
      # compiling when `Meta` gained fields, and how `model-check/Cargo.lock`
      # drifted out of date. Build them here (with `--locked`, so a stale lock
      # fails too) and the next drift fails this PR gate instead of the nightly
      # fuzz schedule.
      - name: Build standalone projects (fuzz, model-check)
        run: |
          set -euo pipefail
          cargo build --manifest-path fuzz/Cargo.toml --locked
          cargo build --manifest-path model-check/Cargo.toml --locked

      - name: Test workspace
        # The double-run determinism gate (m0_determinism.rs: two runs of the
        # same fixed scenario must be byte-identical) is part of this PR gate,
        # run here via `cargo test --workspace`.
        run: cargo test --workspace

      - name: Test the fault-injection feature (INV2 crash sweep, slow-disk A/B)
        # The ready-stage crash hook (propsol v0.2.9 L) is a non-default,
        # release-excluded feature, so its INV2 sweep needs its own run. The
        # release-feature gate below proves it is absent from shipped artifacts.
        # `slow_fsync` rides the same feature: it is the A/B for what the
        # durability pipeline is for (with a slow disk the actor must keep
        # serving instead of waiting for its own flush).
        run: |
          cargo test -p arachne --features fault-injection --test m2_durability
          cargo test -p arachne --features fault-injection --test slow_fsync

      - name: Build lean core (no default features)
        run: cargo build -p arachne --no-default-features

      - name: Dependency-boundary gate
        run: bash scripts/check-deps.sh

      - name: Entropy gate
        run: bash scripts/check-entropy.sh

      - name: Profile-knob gate
        # Every tuned knob in `ProfileConfig` must be read by production code:
        # `wal_trailing_keep` and `proposal_queue_bytes` both sat unread for
        # milestones while operators could set them.
        run: bash scripts/check-profile-knobs.sh

      - name: Release-feature gate (D-ART-testobs)
        # Proves the shipped `arachne-node` artifact excludes the
        # `test-observability` feature (the one recorded "test code in
        # production" exception): the release binary must not contain markers,
        # while a feature-on build must.
        run: bash scripts/check-release-features.sh

      - name: Build examples
        # The examples are the consumer-facing demo and the compile gate for
        # the embedder API (D-ART): `arachne/examples/single_node.rs` is a
        # complete, runnable program that only the public API can build.
        run: cargo build --examples

      # ---------------------------------------------------------------------
      # Future gate (land in a later phase — do NOT enable yet):
      #
      #   - `cargo clippy --workspace --all-targets -- -D warnings`
      #       The toolchain install above uses `--profile minimal`, which does
      #       not include the `clippy` component, and `rust-toolchain.toml`
      #       pins only the channel (no `components` key). This gate can be
      #       enabled once `--component clippy` is added to the toolchain
      #       step above.
      # ---------------------------------------------------------------------
      # - name: Lint (clippy, deny warnings)
      #   run: cargo clippy --workspace --all-targets -- -D warnings

  # L2 (deterministic simulator): real tonic over turmoil. Separate from the
  # workspace job because `l2/` is its own cargo workspace; it is the only place
  # the simulator runs, so its tests (the 3-node real-tonic cluster plus the
  # transport latency gate) are a gate here.
  l2:
    name: L2 (turmoil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain pinned by rust-toolchain.toml
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          [ -n "${channel}" ] || { echo "error: could not parse channel from rust-toolchain.toml"; exit 1; }
          rustup toolchain install "${channel}" --profile minimal
          rustup default "${channel}"

      - name: Install protoc 3.x (raft-proto codegen requirement)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip
          unzip -o -q /tmp/protoc.zip -d "$HOME/protoc3"
          echo "$HOME/protoc3/bin" >> "$GITHUB_PATH"
          "$HOME/protoc3/bin/protoc" --version

      - name: L2 tests (real tonic over turmoil, no ignored tests)
        working-directory: l2
        run: cargo test

  # Fuzz job: runs only on the nightly schedule or manual dispatch (not per-PR).
  # Uses `github.event_name` to gate: `schedule` and `workflow_dispatch` are
  # the only triggers that should run the fuzzer.
  fuzz:
    name: Fuzz (wal_recovery)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain (libFuzzer requires nightly)
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      # Same requirement as the other jobs: `raft-proto`'s build script needs a
      # `protoc` 3.x. Without this the fuzz job died while *building* the target
      # (`protobuf-build` panics with `Option::unwrap() on None`), before the
      # fuzzer ever ran.
      - name: Install protoc 3.x (raft-proto codegen requirement)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip
          unzip -o -q /tmp/protoc.zip -d "$HOME/protoc3"
          echo "$HOME/protoc3/bin" >> "$GITHUB_PATH"
          "$HOME/protoc3/bin/protoc" --version

      - name: Run fuzz target (wal_recovery) for a bounded wall-clock
        working-directory: fuzz
        run: cargo +nightly fuzz run wal_recovery -- -max_total_time=300
